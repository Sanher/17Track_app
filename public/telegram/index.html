<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Paquetes Telegram</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="shell">
    <header class="hero">
      <p class="eyebrow">Telegram Mini App</p>
      <h1>Paquetes</h1>
      <p id="userMeta" class="hero-copy">Conectando...</p>
    </header>

    <section class="panel filters">
      <label class="field">
        <span>Estado</span>
        <select id="statusFilter">
          <option value="">Todos</option>
          <option value="in_transit">Enviado</option>
          <option value="out_for_delivery">En reparto</option>
          <option value="delivered">Entregado</option>
        </select>
      </label>

      <label class="field">
        <span>Courier</span>
        <select id="courierFilter">
          <option value="">Todos</option>
        </select>
      </label>

      <label class="field field-grow">
        <span>Alias</span>
        <input id="aliasFilter" type="search" autocomplete="off" placeholder="Filtrar por alias">
      </label>

      <label class="field">
        <span>Orden</span>
        <select id="sortFilter">
          <option value="status">Estado</option>
          <option value="recent">Mas recientes</option>
          <option value="oldest">Mas antiguos</option>
        </select>
      </label>

      <button id="refreshButton" class="primary-button" type="button">Actualizar</button>
    </section>

    <section id="statusBar" class="panel status-bar hidden"></section>
    <main id="listRoot" class="list-root"></main>
  </div>

  <template id="itemTemplate">
    <article class="card">
      <div class="card-top">
        <div>
          <p class="tracking"></p>
          <p class="owner"></p>
        </div>
        <span class="pill state"></span>
      </div>

      <dl class="facts">
        <div>
          <dt>Alias</dt>
          <dd class="alias"></dd>
        </div>
        <div>
          <dt>Courier</dt>
          <dd class="courier"></dd>
        </div>
        <div>
          <dt>Ultimo evento</dt>
          <dd class="event"></dd>
        </div>
        <div>
          <dt>Fecha</dt>
          <dd class="when"></dd>
        </div>
      </dl>

      <div class="actions">
        <button class="delivered-button primary-button" type="button">Marcar delivered</button>
      </div>
    </article>
  </template>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="./app.js"></script>
</body>
</html>
