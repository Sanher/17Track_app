<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HA IMAP Tracker</title>
  <link rel="stylesheet" href="/telegram/app/app.css">
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div class="hero-top">
        <button id="themeToggleButton" class="soft-button theme-button" type="button">Modo oscuro</button>
      </div>
      <h1>HA IMAP Tracker</h1>
      <p id="userMeta" class="hero-copy">Conectando...</p>
    </header>

    <section id="lockedPanel" class="panel locked-panel hidden">
      <p class="locked-title">Acceso restringido</p>
      <p id="lockedMessage" class="locked-message">
        Validando sesion de Telegram...
      </p>
    </section>

    <div id="appRoot" class="hidden">
      <section class="panel controls-panel">
        <div class="controls-topline">
          <p class="controls-copy">Vista compacta de paquetes ya enviados.</p>
          <div class="controls-actions">
            <button id="refreshMailButton" class="soft-button" type="button">Refrescar correo</button>
          </div>
        </div>

        <details class="filters-details">
          <summary>Filtros y orden</summary>

          <div class="filters">
            <label class="field">
              <span>Estado</span>
              <select id="statusFilter">
                <option value="">Todos</option>
                <option value="out_for_delivery">En reparto</option>
                <option value="in_transit">Enviado</option>
                <option value="delivered">Entregado</option>
              </select>
            </label>

            <label class="field">
              <span>Courier</span>
              <select id="courierFilter">
                <option value="">Todos</option>
              </select>
            </label>

            <label class="field field-grow">
              <span>Alias</span>
              <input id="aliasFilter" type="search" autocomplete="off" placeholder="Filtrar por alias">
            </label>

            <label class="field">
              <span>Orden</span>
              <select id="sortFilter">
                <option value="status">Estado</option>
                <option value="recent">Mas recientes</option>
                <option value="oldest">Mas antiguos</option>
              </select>
            </label>
          </div>
        </details>
      </section>

      <section id="statusBar" class="panel status-bar hidden"></section>
      <main id="listRoot" class="list-root"></main>
    </div>
  </div>

  <template id="itemTemplate">
    <article class="card">
      <div class="card-top">
        <div>
          <p class="tracking"></p>
          <p class="owner"></p>
        </div>
        <span class="pill state"></span>
      </div>

      <dl class="facts">
        <div>
          <dt>Alias</dt>
          <dd class="alias"></dd>
        </div>
        <div>
          <dt>Courier</dt>
          <dd class="courier"></dd>
        </div>
        <div>
          <dt>Remitente</dt>
          <dd class="sender"></dd>
        </div>
        <div>
          <dt>Ultimo evento</dt>
          <dd class="event"></dd>
        </div>
        <div>
          <dt>Fecha</dt>
          <dd class="when"></dd>
        </div>
      </dl>

      <div class="actions">
        <button class="not-package-button soft-button" type="button">No es paquete</button>
        <button class="delivered-button secondary-button" type="button">Marcar delivered</button>
      </div>
    </article>
  </template>

  <button id="backToTopButton" class="back-to-top hidden" type="button" aria-label="Volver arriba">
    Arriba
  </button>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/telegram/app/app.js"></script>
</body>
</html>
